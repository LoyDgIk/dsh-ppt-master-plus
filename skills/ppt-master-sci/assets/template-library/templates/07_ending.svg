<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="academic_defense_cover_master" data-pptx-master-name="Academic Defense Cover"
  data-pptx-layout="ending" data-pptx-layout-name="Ending">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#1E293B"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="ending-accent" x="96" y="284" width="72" height="5" rx="2.5" fill="#64748B"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="96 324 1088 84">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="96" y="384" fill="#F8FAFC" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="44" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="ending-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="96 428 936 44">
    <text id="ending-subtitle-carrier" data-pptx-carrier="true"
      x="96" y="460" fill="#CBD5E1" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="21">{{SUBTITLE}}</text>
  </g>
  <line id="ending-contact-rule" x1="96" y1="536" x2="240" y2="536" stroke="#475569"
