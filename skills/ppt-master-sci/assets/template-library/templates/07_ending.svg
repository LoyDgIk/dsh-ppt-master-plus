      x="96" y="572" fill="#94A3B8" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="16">{{CONTACT}}</text>
  </g>
  <g id="ending-date-slot" data-pptx-placeholder="date" data-pptx-idx="3"
    data-pptx-bounds="96 590 400 32">
    <text id="ending-date-carrier" data-pptx-carrier="true"
      x="96" y="612" fill="#64748B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="15">{{DATE}}</text>
  </g>
